# The public, read-only demo on Render (render.com), as a Blueprint: in the
# Render dashboard, New > Blueprint, and pick this repository. Deploys on
# every push to main. See "Hosted demo" in the README.
#
# Demo mode needs no secrets: no sign-in, no Anthropic key, no Gmail. The
# demo database isn't on a disk; the server rebuilds it from the seed each
# time it starts (src/instrumentation.ts). Any Node host can run it with
# the same build and start commands.
services:
  - type: web
    name: job-tracker-demo
    runtime: node
    plan: free
    # Dev dependencies (TypeScript, Tailwind) are needed to build.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /board
    envVars:
      - key: DEMO_MODE
        value: "true"
      # Pinned to a patched release: 22.23.4 fixes CVE-2026-111497 (Brotli
      # decoder) and the other October 2026 Node security fixes. Raise it
      # for later security releases rather than floating on "22".
      - key: NODE_VERSION
        value: "22.23.4"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Anonymous visit counts (GoatCounter: no cookies, no personal data).
      # Not a secret: it ends up in the page anyway. The demo only; the live
      # app never loads it (src/components/demo-analytics.tsx).
      - key: GOATCOUNTER_URL
        value: "https://2rats.goatcounter.com/count"
